[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"
[project]
name = "cocsim-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]
[tool.scikit-build]
wheel.packages = ["python/cocsim_rl"]
cmake.args = ["-DCOCSIM_BUILD_PYTHON=ON", "-DCOCSIM_BUILD_TESTS=OFF"]
