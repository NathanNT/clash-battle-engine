[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"
[project]
name = "clash-battle-engine-rl"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]
[tool.scikit-build]
wheel.packages = ["python/clash_battle_engine_rl"]
cmake.args = ["-DCLASH_BATTLE_ENGINE_BUILD_PYTHON=ON", "-DCLASH_BATTLE_ENGINE_BUILD_TESTS=OFF"]
